name: Generate Better Growing Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build snake GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER_NAME: livchea12
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests
          mkdir -p dist
          python - << 'PY'
          import os, random, datetime as dt
          from collections import deque
          import requests
          from PIL import Image, ImageDraw

          USER = os.environ["GITHUB_USER_NAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          to_date = dt.datetime.utcnow()
          from_date = to_date - dt.timedelta(days=370)

          r = requests.post(
            "https://api.github.com/graphql",
            headers={"Authorization": f"Bearer {TOKEN}"},
            json={
              "query": query,
              "variables": {
                "login": USER,
                "from": from_date.isoformat() + "Z",
                "to": to_date.isoformat() + "Z",
              },
            },
            timeout=30,
          )
          r.raise_for_status()
          weeks = r.json()["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cols = len(weeks)
          rows = 7
          grid = [[0 for _ in range(rows)] for _ in range(cols)]
          for x, w in enumerate(weeks):
              for d in w["contributionDays"]:
                  grid[x][d["weekday"]] = d["contributionCount"]

          # Food weight = contribution count (cap to avoid giant snake)
          food_weight = {}
          for x in range(cols):
              for y in range(rows):
                  c = grid[x][y]
                  if c > 0:
                      food_weight[(x, y)] = min(c, 6)

          dirs = [(1,0),(-1,0),(0,1),(0,-1)]

          def neighbors(p):
              x, y = p
              for dx, dy in dirs:
                  nx, ny = x + dx, y + dy
                  if 0 <= nx < cols and 0 <= ny < rows:
                      yield (nx, ny)

          def bfs_next(start, targets, blocked):
              q = deque([start])
              prev = {start: None}
              found = None
              while q:
                  cur = q.popleft()
                  if cur in targets:
                      found = cur
                      break
                  for nb in neighbors(cur):
                      if nb in prev or nb in blocked:
                          continue
                      prev[nb] = cur
                      q.append(nb)
              if found is None:
                  return None
              cur = found
              while prev[cur] is not None and prev[cur] != start:
                  cur = prev[cur]
              return cur

          # start near center
          sx, sy = cols // 2, rows // 2
          snake = deque([(sx - 2, sy), (sx - 1, sy), (sx, sy)])
          snake = deque([(max(0, min(cols-1,x)), max(0, min(rows-1,y))) for x,y in snake])

          # render setup
          scale = 3
          cell, gap, pad = 12 * scale, 3 * scale, 16 * scale
          W = pad * 2 + cols * cell + (cols - 1) * gap
          H = pad * 2 + rows * cell + (rows - 1) * gap

          bg = (13, 17, 23)
          d0 = (22, 27, 34)
          d1 = (14, 68, 41)
          d2 = (0, 109, 50)
          d3 = (38, 166, 65)
          d4 = (57, 211, 83)
          snake_c = (80, 230, 110)
          head_c = (170, 255, 180)

          def dot_color(n):
              if n <= 0: return d0
              if n < 3: return d1
              if n < 6: return d2
              if n < 10: return d3
              return d4

          frames = []
          steps = cols * rows * 6

          for _ in range(steps):
              head = snake[-1]
              blocked = set(snake)
              targets = set(food_weight.keys())

              nxt = None
              if targets:
                  if random.random() < 0.14:
                      cands = [p for p in neighbors(head) if p not in blocked]
                      if cands:
                          nxt = random.choice(cands)
                  if nxt is None:
                      nxt = bfs_next(head, targets, blocked)

              if nxt is None:
                  cands = [p for p in neighbors(head) if p not in blocked]
                  if not cands:
                      break
                  nxt = random.choice(cands)

              snake.append(nxt)

              # true growth by contribution count
              if nxt in food_weight:
                  grow = food_weight.pop(nxt)
                  # already grew by +1 via append, add remaining
                  for _ in range(max(0, grow - 1)):
                      snake.appendleft(snake[0])
              else:
                  snake.popleft()

              im = Image.new("RGB", (W, H), bg)
              dr = ImageDraw.Draw(im)

              for x in range(cols):
                  for y in range(rows):
                      px = pad + x * (cell + gap)
                      py = pad + y * (cell + gap)
                      dr.rounded_rectangle([px, py, px + cell, py + cell], radius=4*scale, fill=dot_color(grid[x][y]))

              for x, y in snake:
                  px = pad + x * (cell + gap)
                  py = pad + y * (cell + gap)
                  dr.rounded_rectangle([px, py, px + cell, py + cell], radius=5*scale, fill=snake_c)

              hx, hy = snake[-1]
              px = pad + hx * (cell + gap)
              py = pad + hy * (cell + gap)
              dr.rounded_rectangle([px, py, px + cell, py + cell], radius=5*scale, fill=head_c)

              # downscale for smoother look
              im = im.resize((W // scale, H // scale), Image.Resampling.LANCZOS)
              frames.append(im)

              if not food_weight:
                  for _ in range(16):
                      frames.append(im.copy())
                  break

          out = "dist/github-contribution-grid-snake-grow.gif"
          frames[0].save(
            out,
            save_all=True,
            append_images=frames[1:],
            duration=75,
            loop=0,
            optimize=False
          )
          print(f"Generated: {out}")
          PY

      - name: Commit and push GIF to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/github-contribution-grid-snake-grow.gif
          git commit -m "Update growing snake gif" || echo "No changes"
          git push
