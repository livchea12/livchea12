name: Generate Growing Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build true-growing snake GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER_NAME: livchea12
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests
          mkdir -p dist
          python - << 'PY'
          import os
          import datetime as dt
          import requests
          from collections import deque
          from PIL import Image, ImageDraw

          USER = os.environ["GITHUB_USER_NAME"]
          TOKEN = os.environ["GITHUB_TOKEN"]

          query = """
          query($login:String!, $from:DateTime!, $to:DateTime!) {
            user(login:$login) {
              contributionsCollection(from:$from, to:$to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      weekday
                    }
                  }
                }
              }
            }
          }
          """
          to_date = dt.datetime.utcnow()
          from_date = to_date - dt.timedelta(days=370)

          r = requests.post(
            "https://api.github.com/graphql",
            headers={"Authorization": f"Bearer {TOKEN}"},
            json={
              "query": query,
              "variables": {
                "login": USER,
                "from": from_date.isoformat() + "Z",
                "to": to_date.isoformat() + "Z",
              },
            },
            timeout=30,
          )
          r.raise_for_status()
          data = r.json()
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cols = len(weeks)
          rows = 7
          grid = [[0 for _ in range(rows)] for _ in range(cols)]

          for x, w in enumerate(weeks):
              for d in w["contributionDays"]:
                  y = d["weekday"]  # 0..6
                  grid[x][y] = d["contributionCount"]

          foods = {(x, y) for x in range(cols) for y in range(rows) if grid[x][y] > 0}

          path = []
          for x in range(cols):
              ys = range(rows) if x % 2 == 0 else range(rows - 1, -1, -1)
              for y in ys:
                  path.append((x, y))

          snake = deque(path[:3])
          frames = []

          # visuals (GitHub dark-like)
          bg = (13, 17, 23)
          dot0 = (22, 27, 34)
          dot1 = (14, 68, 41)
          dot2 = (0, 109, 50)
          dot3 = (38, 166, 65)
          dot4 = (57, 211, 83)
          snake_c = (57, 211, 83)

          cell = 14
          gap = 4
          pad = 20
          W = pad * 2 + cols * cell + (cols - 1) * gap
          H = pad * 2 + rows * cell + (rows - 1) * gap

          def dot_color(n):
              if n <= 0: return dot0
              if n < 3: return dot1
              if n < 6: return dot2
              if n < 10: return dot3
              return dot4

          idx = 3
          max_steps = len(path) * 4
          for _ in range(max_steps):
              head = path[idx % len(path)]
              idx += 1
              snake.append(head)

              grew = False
              if head in foods:
                  foods.remove(head)
                  grew = True

              if not grew:
                  snake.popleft()

              im = Image.new("RGB", (W, H), bg)
              dr = ImageDraw.Draw(im)

              for x in range(cols):
                  for y in range(rows):
                      px = pad + x * (cell + gap)
                      py = pad + y * (cell + gap)
                      dr.rounded_rectangle([px, py, px + cell, py + cell], radius=3, fill=dot_color(grid[x][y]))

              for (x, y) in snake:
                  px = pad + x * (cell + gap)
                  py = pad + y * (cell + gap)
                  dr.rounded_rectangle([px, py, px + cell, py + cell], radius=4, fill=snake_c)

              hx, hy = snake[-1]
              px = pad + hx * (cell + gap)
              py = pad + hy * (cell + gap)
              dr.rounded_rectangle([px, py, px + cell, py + cell], radius=4, fill=(140, 255, 170))

              frames.append(im)

              if not foods:
                  for _ in range(20):
                      frames.append(im.copy())
                  break

          out = "dist/github-contribution-grid-snake-grow.gif"
          frames[0].save(out, save_all=True, append_images=frames[1:], duration=70, loop=0, optimize=False)
          print(f"wrote {out}")
          PY

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Generate true-growing contribution snake"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
